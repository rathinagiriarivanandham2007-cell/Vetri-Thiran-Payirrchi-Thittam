<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketSmart AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">PocketSmart <span>AI</span></div>
    <p>Your Smart Budget & Recommendation Assistant</p>
  </header>

  <main>
    <section class="hero">
      <h1>Spend Smart. Choose Better.</h1>
      <p>Tell PocketSmart AI your budget and needs. Get simple, budget-aware recommendations.</p>
    </section>

    <section class="card">
      <h2>Get Your Recommendation</h2>

      <form id="recommendForm">
        <label>Budget (₹)</label>
        <input id="budget" type="number" min="1" placeholder="Example: 50000" required>

        <label>Category</label>
        <input id="category" type="text" placeholder="Example: Smartphone" required>

        <label>Preference</label>
        <input id="preference" type="text" placeholder="Example: Camera, battery and performance">

        <label>Goal</label>
        <textarea id="goal" placeholder="Example: I want the best phone for college and coding"></textarea>

        <button type="submit">Get Smart Recommendations</button>
      </form>
    </section>

    <section id="result" class="result hidden"></section>
  </main>

  <footer>© 2026 PocketSmart AI</footer>
  <script src="app.js"></script>
</body>
</html>
